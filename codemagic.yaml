workflows:
  ios-capacitor-release:
    name: BEX Trader iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: 16.4
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.bextrader.app"

    scripts:
      - name: Install dependencies
        script: |
          npm ci

          echo "=== ENSURE CAPACITOR PACKAGES ==="
          npm install @capacitor/core @capacitor/cli @capacitor/ios --save

      - name: Create Capacitor config
        script: |
          echo "=== CREATE CLEAN capacitor.config.json ==="

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.bextrader.app",
            "appName": "BEX Trader",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          JSON

          echo "=== VALIDATE ROOT CAPACITOR CONFIG ==="
          cat capacitor.config.json
          node -e "JSON.parse(require('fs').readFileSync('capacitor.config.json','utf8')); console.log('capacitor.config.json OK')"

      - name: Build web app
        script: |
          npm run build

      - name: Recreate clean iOS project
        script: |
          echo "=== REMOVE OLD IOS ==="
          rm -rf ios

          echo "=== ADD CLEAN IOS ==="
          npx cap add ios

          echo "=== SYNC IOS ==="
          npx cap sync ios

          echo "=== FIX/VALIDATE IOS CAPACITOR CONFIG ==="
          cp capacitor.config.json ios/App/App/capacitor.config.json
          cat ios/App/App/capacitor.config.json
          node -e "JSON.parse(require('fs').readFileSync('ios/App/App/capacitor.config.json','utf8')); console.log('ios capacitor.config.json OK')"

          echo "=== CLEAN XCODE USER / CACHE FILES ==="
          find ios -name Package.resolved -delete || true
          find ios -name "*.xcuserstate" -delete || true
          find ios -path "*/xcuserdata/*" -delete || true
          rm -rf ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm || true
          rm -rf ios/App/App.xcodeproj/project.xcworkspace/xcuserdata || true
          rm -rf ~/Library/Developer/Xcode/DerivedData/* || true

          echo "=== POD INSTALL ==="
          cd ios/App
          pod install --repo-update
          cd ../..

          echo "=== IOS FILES ==="
          ls -la ios/App
          ls -la ios/App/App
          ls -la ios/App/App.xcodeproj
          ls -la ios/App/App.xcworkspace || true

          echo "=== PBXPROJ LINT ==="
          plutil -lint ios/App/App.xcodeproj/project.pbxproj

          echo "=== XCODE PROJECT LIST ==="
          xcodebuild -project ios/App/App.xcodeproj -list

          echo "=== XCODE WORKSPACE LIST ==="
          xcodebuild -workspace ios/App/App.xcworkspace -list

      - name: Set iOS build number
        script: |
          echo "Using BUILD_NUMBER=$BUILD_NUMBER"
          perl -0pi -e "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = $ENV{BUILD_NUMBER};/g" ios/App/App.xcodeproj/project.pbxproj
          grep -n "CURRENT_PROJECT_VERSION" ios/App/App.xcodeproj/project.pbxproj || true

      - name: Fetch iOS signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --issuer-id @env:APP_STORE_CONNECT_ISSUER_ID \
            --key-id @env:APP_STORE_CONNECT_KEY_IDENTIFIER \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY

      - name: Set up keychain
        script: |
          keychain initialize
          keychain add-certificates

      - name: Create export options plist
        script: |
          cat > /Users/builder/export_options.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>export</string>
            <key>compileBitcode</key>
            <false/>
            <key>uploadBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

          plutil -lint /Users/builder/export_options.plist
          cat /Users/builder/export_options.plist

      - name: Build signed IPA
        script: |
          echo "=== FINAL SCHEME CHECK ==="
          xcodebuild -workspace ios/App/App.xcworkspace -list

          echo "=== BUILD SIGNED IPA ==="
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --export-options-plist /Users/builder/export_options.plist \
            --verbose

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /Users/builder/export_options.plist

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true