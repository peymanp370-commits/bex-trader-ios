workflows:
  ios-capacitor-release:
    name: BEX Trader iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: latest
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.bextrader.app"

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Clean broken Xcode cache
        script: |
          rm -rf ios/App/App.xcodeproj/project.xcworkspace || true
          find ios/App -name Package.resolved -delete || true
          rm -rf ios/App/CapApp-SPM/.swiftpm || true
          rm -rf ~/Library/Developer/Xcode/DerivedData/* || true

      - name: Auto increase iOS build number
        script: |
          echo "Using Codemagic BUILD_NUMBER=$BUILD_NUMBER"
          perl -0pi -e "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = $ENV{BUILD_NUMBER};/g" ios/App/App.xcodeproj/project.pbxproj
          grep -n "CURRENT_PROJECT_VERSION" ios/App/App.xcodeproj/project.pbxproj

      - name: Fetch iOS signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --issuer-id @env:APP_STORE_CONNECT_ISSUER_ID \
            --key-id @env:APP_STORE_CONNECT_KEY_IDENTIFIER \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY

      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates

      - name: Build signed IPA
        script: |
          echo "=== CHECK IOS FILES ==="
          ls -la ios/App
          ls -la ios/App/App.xcodeproj
          cat ios/App/App/App.entitlements || true

          echo "=== BUILD IPA ==="
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
