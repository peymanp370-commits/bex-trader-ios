workflows:
  ios-capacitor-release:
    name: BEX Trader iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: 16.4
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.bextrader.app"

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web app
        script: |
          npm run build

      - name: Recreate clean iOS project inside Codemagic
        script: |
          echo "=== REMOVE OLD IOS PROJECT FROM CI CLONE ==="
          rm -rf ios

          echo "=== ADD CLEAN CAPACITOR IOS PROJECT ==="
          npx cap add ios

          echo "=== SYNC CAPACITOR IOS ==="
          npx cap sync ios

          echo "=== DELETE BAD XCODE CACHE / PACKAGE FILES ==="
          find ios/App -name Package.resolved -delete || true
          find ios/App -name "*.xcuserstate" -delete || true
          rm -rf ~/Library/Developer/Xcode/DerivedData/* || true

          echo "=== IOS FILES AFTER RECREATE ==="
          ls -la ios
          ls -la ios/App
          ls -la ios/App/App.xcodeproj
          ls -la ios/App/App.xcworkspace || true

          echo "=== PBXPROJ LINT ==="
          plutil -lint ios/App/App.xcodeproj/project.pbxproj

          echo "=== WORKSPACE CONTENT ==="
          cat ios/App/App.xcworkspace/contents.xcworkspacedata || true

          echo "=== XCODE LIST WORKSPACE ==="
          xcodebuild -workspace ios/App/App.xcworkspace -list || true

      - name: Auto increase iOS build number
        script: |
          echo "Using BUILD_NUMBER=$BUILD_NUMBER"
          perl -0pi -e "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = $ENV{BUILD_NUMBER};/g" ios/App/App.xcodeproj/project.pbxproj
          grep -n "CURRENT_PROJECT_VERSION" ios/App/App.xcodeproj/project.pbxproj || true

      - name: Fetch iOS signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --issuer-id @env:APP_STORE_CONNECT_ISSUER_ID \
            --key-id @env:APP_STORE_CONNECT_KEY_IDENTIFIER \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY

      - name: Set up keychain
        script: |
          keychain initialize
          keychain add-certificates

      - name: Create export options plist
        script: |
          cat > /Users/builder/export_options.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>export</string>
            <key>compileBitcode</key>
            <false/>
            <key>uploadBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

          echo "=== EXPORT OPTIONS CREATED ==="
          ls -la /Users/builder/export_options.plist
          plutil -lint /Users/builder/export_options.plist
          cat /Users/builder/export_options.plist

      - name: Build signed IPA
        script: |
          echo "=== BUILD SIGNED IPA WITH CLEAN WORKSPACE ==="

          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --export-options-plist /Users/builder/export_options.plist \
            --verbose

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /Users/builder/export_options.plist

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true