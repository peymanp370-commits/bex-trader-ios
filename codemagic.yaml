workflows:
  ios-capacitor-release:
    name: BEX Trader iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: latest
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.bextrader.app"

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Clean Xcode cache
        script: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/* || true
          find ios/App -name Package.resolved -delete || true

      - name: Auto increase iOS build number
        script: |
          echo "Using BUILD_NUMBER=$BUILD_NUMBER"
          perl -0pi -e "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = $ENV{BUILD_NUMBER};/g" ios/App/App.xcodeproj/project.pbxproj
          grep -n "CURRENT_PROJECT_VERSION" ios/App/App.xcodeproj/project.pbxproj

      - name: Fetch iOS signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --issuer-id @env:APP_STORE_CONNECT_ISSUER_ID \
            --key-id @env:APP_STORE_CONNECT_KEY_IDENTIFIER \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY

      - name: Set up keychain
        script: |
          keychain initialize
          keychain add-certificates

      - name: Apply code signing settings
        script: |
          xcode-project use-profiles \
            --project ios/App/App.xcodeproj

      - name: Show signing info
        script: |
          echo "=== PROFILES ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles || true

          echo "=== CERTIFICATES ==="
          security find-identity -v -p codesigning || true

          echo "=== PROJECT ==="
          ls -la ios/App
          ls -la ios/App/App.xcodeproj
          cat ios/App/App/App.entitlements || true

      - name: Create export options plist
        script: |
          python3 - <<'PY'
          import plistlib
          data = {
              "method": "app-store",
              "signingStyle": "automatic",
              "uploadBitcode": False,
              "compileBitcode": False,
              "destination": "export"
          }
          with open("/Users/builder/export_options.plist", "wb") as f:
              plistlib.dump(data, f)
          PY
          plutil -lint /Users/builder/export_options.plist
          cat /Users/builder/export_options.plist

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --export-options-plist /Users/builder/export_options.plist \
            --verbose

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /Users/builder/export_options.plist

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true