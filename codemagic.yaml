workflows:
  ios-capacitor-release:
    name: BEX Trader iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: 16.4
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.bextrader.app"

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web app
        script: |
          npm run build

      - name: Fetch iOS signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --issuer-id @env:APP_STORE_CONNECT_ISSUER_ID \
            --key-id @env:APP_STORE_CONNECT_KEY_IDENTIFIER \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY

      - name: Set up keychain
        script: |
          keychain initialize
          keychain add-certificates

      - name: Create export options plist
        script: |
          cat > /Users/builder/export_options.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>export</string>
            <key>compileBitcode</key>
            <false/>
            <key>uploadBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

          plutil -lint /Users/builder/export_options.plist
          cat /Users/builder/export_options.plist

      - name: Build signed IPA
        script: |
          echo "=== FORCE RECREATE IOS INSIDE FINAL BUILD STEP ==="

          rm -rf ios

          npx cap add ios
          npx cap sync ios

          rm -rf ~/Library/Developer/Xcode/DerivedData/* || true
          find ios -name Package.resolved -delete || true
          find ios -name "*.xcuserstate" -delete || true

          echo "=== IOS FILES ==="
          ls -la ios
          ls -la ios/App
          ls -la ios/App/App.xcodeproj
          ls -la ios/App/App.xcworkspace || true

          echo "=== PBXPROJ FIRST LINES ==="
          sed -n '1,40p' ios/App/App.xcodeproj/project.pbxproj

          echo "=== CONFLICT CHECK ==="
          grep -n "<<<<<<<\|=======\|>>>>>>>" ios/App/App.xcodeproj/project.pbxproj && exit 1 || true

          echo "=== SET BUILD NUMBER ==="
          perl -0pi -e "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = $ENV{BUILD_NUMBER};/g" ios/App/App.xcodeproj/project.pbxproj
          grep -n "CURRENT_PROJECT_VERSION" ios/App/App.xcodeproj/project.pbxproj || true

          echo "=== POD INSTALL ==="
          cd ios/App
          pod install --repo-update
          cd ../..

          echo "=== XCODE LIST WORKSPACE ==="
          xcodebuild -workspace ios/App/App.xcworkspace -list

          echo "=== BUILD SIGNED IPA ==="
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --export-options-plist /Users/builder/export_options.plist \
            --verbose

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /Users/builder/export_options.plist

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true